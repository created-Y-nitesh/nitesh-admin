<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Users — Admin</title><meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar"><span class="topbar__title">Users</span></header>
    <main class="page-body">
      <div class="card">
        <div class="card__header"><span class="card__title">All Clients</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Name</th><th>Email</th><th>Telegram</th><th>Company</th><th>Joined</th><th>Status</th></tr></thead>
            <tbody id="users-body"><tr><td colspan="6" class="loading"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module">
import { guardAdmin } from "./js/core/auth.js";
import { renderSidebar } from "./js/components/sidebar.js";
import { api } from "./js/core/api.js";

await guardAdmin();
renderSidebar("users");

const tbody = document.getElementById("users-body");
function fmtDate(d) { try { return new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" }); } catch { return "—"; } }

async function load() {
  try {
    const resp = await api.get("/admin/users", { limit: 100 });
    const rows = resp.data || [];
    if (!rows.length) { tbody.innerHTML = `<tr><td colspan="6" class="empty">No users found</td></tr>`; return; }
    tbody.innerHTML = rows.map(u => `
      <tr>
        <td><strong>${u.name}</strong></td>
        <td class="text-muted">${u.email}</td>
        <td class="text-muted">${u.telegram_username ? "@" + u.telegram_username : "—"}</td>
        <td class="text-muted">${u.company || "—"}</td>
        <td class="text-muted">${fmtDate(u.created_at)}</td>
        <td><span class="badge ${u.is_active ? "badge--green" : "badge--red"}">${u.is_active ? "Active" : "Inactive"}</span></td>
      </tr>`).join("");
  } catch(e) { tbody.innerHTML = `<tr><td colspan="6" class="empty">Error: ${e.message}</td></tr>`; }
}
load();
</script>
</body>
</html>
