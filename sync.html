<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sync Status — Admin</title><meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar"><span class="topbar__title">Google Sheets Sync Status</span></header>
    <main class="page-body">
      <div class="stat-grid" id="sync-stats"><div class="loading"><div class="spinner"></div></div></div>
      <div class="card">
        <div class="card__header"><span class="card__title">Sync Jobs</span></div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>Type</th><th>Action</th><th>Status</th><th>Retries</th><th>Error</th><th>Created</th></tr></thead>
            <tbody id="sync-body"><tr><td colspan="6" class="loading"><div class="spinner"></div></td></tr></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>
<script type="module">
import { guardAdmin } from "./js/core/auth.js";
import { renderSidebar } from "./js/components/sidebar.js";
import { api } from "./js/core/api.js";

await guardAdmin();
renderSidebar("sync");

function fmtDate(d) { try { return new Date(d).toLocaleString("en-IN"); } catch { return "—"; } }
function badge(s) { const m={SUCCESS:"green",PENDING:"yellow",FAILED:"red",PROCESSING:"blue"}; return `badge--${m[s]||"dim"}`; }

async function load() {
  try {
    const resp = await api.get("/admin/sync-jobs");
    const jobs = resp.data?.jobs || [];
    const stats = resp.data?.stats || {};

    document.getElementById("sync-stats").innerHTML = `
      <div class="stat-card"><div class="stat-card__label">Pending</div><div class="stat-card__value" style="color:var(--yellow)">${stats.pending||0}</div></div>
      <div class="stat-card"><div class="stat-card__label">Failed</div><div class="stat-card__value" style="color:var(--red)">${stats.failed||0}</div></div>
      <div class="stat-card stat-card--accent"><div class="stat-card__label">Success</div><div class="stat-card__value">${stats.success||0}</div></div>
      <div class="stat-card"><div class="stat-card__label">Total</div><div class="stat-card__value">${stats.total||0}</div></div>
    `;

    const tbody = document.getElementById("sync-body");
    if (!jobs.length) { tbody.innerHTML=`<tr><td colspan="6" class="empty">No sync jobs</td></tr>`; return; }
    tbody.innerHTML = jobs.map(j=>`
      <tr>
        <td>${j.entity_type||"—"}</td>
        <td>${j.action||"—"}</td>
        <td><span class="badge ${badge(j.status)}">${j.status}</span></td>
        <td>${j.retry_count||0}</td>
        <td class="text-muted" style="font-size:11px;max-width:200px;overflow:hidden;text-overflow:ellipsis;">${j.last_error||"—"}</td>
        <td class="text-muted">${fmtDate(j.created_at)}</td>
      </tr>`).join("");
  } catch(e) {
    document.getElementById("sync-body").innerHTML=`<tr><td colspan="6" class="empty">Error: ${e.message}</td></tr>`;
  }
}
load();
</script>
</body>
</html>
